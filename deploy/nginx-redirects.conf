# ---------------------------------------------------------------------------
# okiyan.com — canonical-host redirects
#
# Goal: exactly one public origin (https://okiyan.com). Every other hostname
# that still resolves (okiyan.ir, www.okiyan.ir, www.okiyan.com) answers with a
# 301 to the same path on the canonical host.
#
# Include this file from a server block that lists the OLD hostnames, e.g.:
#
#     server {
#         listen 80;
#         server_name okiyan.ir www.okiyan.ir www.okiyan.com;
#         include /etc/nginx/snippets/okiyan-redirects.conf;
#     }
#
# For HTTPS you need a certificate that also covers the old names, then the
# same `include` inside the 443 server block.
#
# Test: nginx -t && systemctl reload nginx
# Verify: curl -sI https://okiyan.ir/guides/china/ | head -3
#         → HTTP/2 301
#         → location: https://okiyan.com/guides/china/
# ---------------------------------------------------------------------------

# Keep ACME (Let's Encrypt) reachable over plain HTTP while a certificate is issued.
location /.well-known/acme-challenge/ {
    root /var/www/letsencrypt;
    try_files $uri =404;
}

# Redirect everything else, preserving path + query string.
location / {
    return 301 https://okiyan.com$request_uri;
}
